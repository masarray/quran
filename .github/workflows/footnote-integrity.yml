name: Footnote Integrity

on:
  push:
    branches:
      - fix/footnote-integrity
  pull_request:
    paths:
      - 'src/components/display/verses/VerseTranslations.svelte'
      - 'src/utils/footnotes.js'
      - 'src/utils/dexie.js'
      - 'scripts/audit-footnotes.mjs'
      - 'scripts/test-footnotes.mjs'
      - 'package.json'
      - '.github/workflows/footnote-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test footnote recovery
        shell: bash
        run: |
          set -o pipefail
          npm run test:footnotes 2>&1 | tee footnote-test.log

      - name: Audit Indonesian footnotes
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run audit:footnotes -- --translation=33 --show-problems=500 --output=footnote-audit-33.json --fail-on-missing 2>&1 | tee footnote-audit-33.log

      - name: Build application
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee footnote-build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footnote-integrity-${{ github.sha }}
          path: |
            footnote-test.log
            footnote-audit-33.log
            footnote-audit-33.json
            footnote-build.log
          if-no-files-found: ignore
          retention-days: 7
