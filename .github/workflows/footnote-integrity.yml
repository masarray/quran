name: Footnote Integrity

on:
  push:
    branches:
      - fix/footnote-integrity
  pull_request:
    paths:
      - 'src/components/display/verses/VerseTranslations.svelte'
      - 'src/utils/footnotes.js'
      - 'scripts/audit-footnotes.mjs'
      - 'package.json'
      - '.github/workflows/footnote-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Indonesian footnotes
        run: npm run audit:footnotes -- --translation=33 --show-problems=500 --output=footnote-audit-33.json

      - name: Build application
        run: npm run build

      - name: Persist audit report on audit branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/footnote-integrity'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- footnote-audit-33.json
          if git diff --cached --quiet; then
            echo "Audit report unchanged"
            exit 0
          fi
          git commit -m "chore: update footnote audit report [skip ci]"
          git push
