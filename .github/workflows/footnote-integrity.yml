name: Footnote Integrity

on:
  push:
    branches:
      - fix/footnote-integrity
  pull_request:
    paths:
      - 'src/components/display/verses/VerseTranslations.svelte'
      - 'src/utils/footnotes.js'
      - 'scripts/audit-footnotes.mjs'
      - 'package.json'
      - '.github/workflows/footnote-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Indonesian footnotes
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run audit:footnotes -- --translation=33 --show-problems=500 --output=footnote-audit-33.json 2>&1 | tee footnote-audit-33.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build application
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee footnote-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist audit diagnostics on audit branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/fix/footnote-integrity'
        shell: bash
        run: |
          cat > footnote-ci-status.txt <<EOF
          audit_exit_code=${{ steps.audit.outputs.exit_code }}
          build_exit_code=${{ steps.build.outputs.exit_code }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- footnote-audit-33.log footnote-build.log footnote-ci-status.txt
          if [ -f footnote-audit-33.json ]; then git add -- footnote-audit-33.json; fi
          if git diff --cached --quiet; then
            echo "Audit diagnostics unchanged"
            exit 0
          fi
          git commit -m "chore: update footnote audit diagnostics [skip ci]"
          git push
