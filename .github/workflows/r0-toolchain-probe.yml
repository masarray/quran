name: R0 Toolchain Probe

on:
  push:
    branches:
      - 'reliability/r0-r1-r2'
    paths:
      - '.github/workflows/r0-toolchain-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime dependencies before probe
        run: npm audit --omit=dev --audit-level=high

      - name: Probe Svelte 5 + vite-plugin-svelte 4
        run: npm install --no-save --package-lock=false svelte@5.57.1 @sveltejs/vite-plugin-svelte@4

      - name: Build candidate
        env:
          GITHUB_PAGES: 'true'
          BASE_PATH: '/quran'
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee toolchain-svelte5-plugin4.log

      - name: Reject known toolchain warnings
        shell: bash
        run: |
          if grep -Eq '"(untrack|fork|settled)" is not exported' toolchain-svelte5-plugin4.log; then
            echo 'Svelte runtime export mismatch remains'
            exit 1
          fi
          if grep -Fq 'Active Svelte 5 support has moved' toolchain-svelte5-plugin4.log; then
            echo 'vite-plugin-svelte major is still stale'
            exit 1
          fi
          if grep -Fq 'css-syntax-error' toolchain-svelte5-plugin4.log; then
            echo 'Malformed generated CSS remains'
            exit 1
          fi
          if grep -Eq 'lightBlue|warmGray|trueGray|coolGray|blueGray' toolchain-svelte5-plugin4.log; then
            echo 'Deprecated Tailwind color aliases remain'
            exit 1
          fi

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-toolchain-svelte5-plugin4-${{ github.sha }}
          path: toolchain-svelte5-plugin4.log
          if-no-files-found: ignore
          retention-days: 3
