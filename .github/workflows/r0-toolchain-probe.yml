name: R0 Toolchain Probe

on:
  push:
    branches:
      - 'reliability/r0-r1-r2'
    paths:
      - '.github/workflows/r0-toolchain-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode:
          - 'current-svelte4'
          - 'current-svelte5'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime dependencies before probe
        run: npm audit --omit=dev --audit-level=high

      - name: Probe Svelte 5 with current SvelteKit
        if: matrix.mode == 'current-svelte5'
        run: npm install --no-save --package-lock=false svelte@5

      - name: Build candidate
        env:
          GITHUB_PAGES: 'true'
          BASE_PATH: '/quran'
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee toolchain-${{ matrix.mode }}.log

      - name: Reject Svelte runtime export mismatch
        shell: bash
        run: |
          if grep -Eq '"(untrack|fork|settled)" is not exported' toolchain-${{ matrix.mode }}.log; then
            echo "${{ matrix.mode }} still imports unavailable Svelte runtime APIs"
            exit 1
          fi

      - name: Diagnose malformed CSS if present
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(dir, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
          }
          const files = [...walk('.svelte-kit'), ...walk('build')].filter((p) => p.endsWith('.css'));
          let found = false;
          for (const file of files) {
            const css = fs.readFileSync(file, 'utf8');
            for (const needle of ['-: .#;', ':#;', '{-:']) {
              const i = css.indexOf(needle);
              if (i >= 0) {
                found = true;
                console.log('MALFORMED_CSS_FILE', file, 'NEEDLE', needle);
                console.log(css.slice(Math.max(0, i - 1000), i + 1000));
              }
            }
          }
          if (!found) console.log('Malformed minifier token not found in emitted CSS; warning is introduced during minification.');
          NODE

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-toolchain-${{ matrix.mode }}-${{ github.sha }}
          path: toolchain-${{ matrix.mode }}.log
          if-no-files-found: ignore
          retention-days: 3
