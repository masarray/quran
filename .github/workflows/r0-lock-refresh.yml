name: R0 Lock Refresh

on:
  push:
    branches:
      - 'reliability/r0-r1-r2'
    paths:
      - '.github/workflows/r0-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reliability/r0-r1-r2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked baseline
        run: npm ci

      - name: Align Svelte runtime and Vite plugin
        run: npm install --save-dev --save-exact svelte@5.57.1 @sveltejs/vite-plugin-svelte@4

      - name: Print resolved toolchain
        run: npm ls svelte @sveltejs/vite-plugin-svelte @sveltejs/kit vite --depth=0

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build candidate
        env:
          GITHUB_PAGES: 'true'
          BASE_PATH: '/quran'
        run: npm run build

      - name: Commit lock refresh
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(r0): align Svelte 5 build toolchain"
          git push origin HEAD:reliability/r0-r1-r2
