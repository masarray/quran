name: Quran Data Integrity

on:
  push:
    branches:
      - 'reliability/r6-data-integrity'
  pull_request:
    paths:
      - 'src/utils/quranDataIntegrity.js'
      - 'src/utils/fetchData.js'
      - 'src/data/quranMeta.js'
      - 'src/data/options.js'
      - 'src/data/websiteSettings.js'
      - 'scripts/test-quran-data-integrity.mjs'
      - 'scripts/audit-quran-data-integrity.mjs'
      - 'package.json'
      - '.github/workflows/quran-data-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test fail-closed validators
        run: npm run test:quran-integrity

      - name: Audit live default Quran datasets
        env:
          QURAN_INTEGRITY_REPORT: quran-data-integrity-report.json
        run: npm run audit:quran-integrity

      - name: Build application
        env:
          GITHUB_PAGES: 'true'
          BASE_PATH: '/quran'
        run: npm run build

      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quran-data-integrity-${{ github.sha }}
          path: quran-data-integrity-report.json
          if-no-files-found: ignore
          retention-days: 14
